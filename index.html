<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>먹달력 - 식품 할인 이벤트 캘린더</title>
<style>
  :root { --bg:#fff; --text:#1c1c1e; --muted:#8e8e93; --line:#f0f0f2; --soft:#f5f5f7; --accent:#ff5a1f; --page:#f2f2f4; --side:#fafafb; --all:#1c1c1e; color-scheme:light; }
  [data-theme=dark] { --bg:#1c1c1e; --text:#f2f2f7; --muted:#98989f; --line:#2c2c2e; --soft:#2c2c2e; --accent:#ff7a45; --page:#000; --side:#161618; --all:#636366; color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--page); }
  body { font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; color:var(--text); }
  .app { max-width:430px; min-height:100vh; margin:0 auto; background:var(--bg); display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
  .top { display:flex; align-items:center; padding:18px 20px 6px; }
  .top h1 { flex:1; margin:0; font-size:28px; font-weight:700; letter-spacing:-.5px; }
  .top h1 small { font-size:15px; font-weight:500; color:var(--muted); margin-left:6px; }
  .ico { border:0; background:none; font-size:20px; width:36px; height:36px; border-radius:50%; cursor:pointer; color:var(--text); padding:0; }
  .ico:active { background:var(--soft); }
  .today-btn { font-size:13px; font-weight:600; color:var(--accent); width:auto; padding:0 10px; }
  #qbox { display:none; padding:4px 20px 8px; } #qbox.on { display:block; }
  #q { width:100%; border:0; background:var(--soft); color:var(--text); border-radius:10px; padding:10px 12px; font-size:15px; outline:none; }
  .side { padding:8px 16px 0; }
  .side h4 { margin:10px 4px 6px; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.3px; }
  .list { display:flex; flex-wrap:wrap; gap:6px; }
  .cat { color:var(--text); display:flex; align-items:center; gap:7px; border-radius:999px; background:var(--soft); padding:7px 12px; font-size:13.5px; font-weight:500; cursor:pointer; user-select:none; }
  .cat .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .cat .cnt { font-size:11.5px; color:var(--muted); margin-left:auto; padding-left:4px; }
  .cat.on { color:#fff !important; font-weight:600; } .cat.on .dot { background:#fff !important; } .cat.on .cnt { color:#ffffffcc; }
  .cat.br { background:none; border:1px solid var(--line); font-size:12.5px; padding:5px 11px; }
  .cat.br.on { border-color:transparent; }
  .brands:empty, .brands:empty + h4 { display:none; }
  @media (min-width:820px) {
    .app { max-width:1040px; flex-direction:row; align-items:flex-start; margin-top:24px; min-height:0; border-radius:20px; overflow:hidden; box-shadow:0 2px 24px #0001; border:1px solid var(--line); }
    .side { width:220px; flex:none; padding:22px 14px; border-right:1px solid var(--line); align-self:stretch; background:var(--side); }
    .side h4 { margin-top:20px; } .side h4:first-child { margin-top:0; }
    .list { flex-direction:column; gap:2px; }
    .cat { border-radius:10px; background:none; padding:9px 10px; }
    .cat:hover { background:var(--soft); } .cat.on:hover { filter:brightness(.95); }
    .cat.br { border:0; padding:6px 10px 6px 26px; font-size:13px; }
    .cat.br.on { padding-left:26px; }
    .cal { flex:1; min-width:0; }
    .day { height:62px; }
  }
  .cal { display:flex; flex-direction:column; width:100%; flex:1; }
  .dow, .days { display:grid; grid-template-columns:repeat(7,1fr); padding:0 12px; }
  .dow { margin-top:8px; }
  .dow div { text-align:center; font-size:11px; color:var(--muted); padding:6px 0; }
  .dow div:first-child, .day.sun .n { color:#f03e5b; } .dow div:last-child, .day.sat .n { color:#3b82f6; }
  .day { height:54px; display:flex; flex-direction:column; align-items:center; padding-top:4px; cursor:pointer; }
  .day .n { width:30px; height:30px; line-height:30px; text-align:center; font-size:15px; border-radius:50%; }
  .day.other .n { opacity:.28; }
  .day.today .n { color:var(--accent); font-weight:700; }
  .day.sel .n { background:var(--text); color:var(--bg) !important; font-weight:600; }
  .day.today.sel .n { background:var(--accent); }
  .dots { display:flex; gap:3px; height:6px; margin-top:3px; align-items:center; }
  .dots i { width:5px; height:5px; border-radius:50%; display:block; }
  .dots em { font-style:normal; font-size:9px; color:var(--muted); line-height:5px; }
  .sheet { flex:1; margin-top:10px; border-top:1px solid var(--line); padding:16px 20px 40px; background:var(--bg); }
  .sheet h3 { margin:0 0 12px; font-size:15px; font-weight:700; } .sheet h3 span { color:var(--muted); font-weight:500; margin-left:4px; }
  .item { display:flex; gap:12px; padding:12px 0; }
  .item + .item { border-top:1px solid var(--line); }
  .bar { flex:none; width:4px; border-radius:2px; }
  .item .t { font-size:15px; font-weight:600; line-height:1.35; }
  .item .b { font-size:12px; font-weight:600; margin-bottom:2px; }
  .item .m { font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.4; }
  .item a { color:var(--accent); text-decoration:none; font-weight:600; }
  .badge { font-size:10.5px; color:var(--muted); background:var(--soft); border-radius:4px; padding:1px 6px; margin-left:6px; font-weight:500; vertical-align:1px; }
  .empty { color:var(--muted); font-size:14px; padding:24px 0; text-align:center; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h4>음식 종류</h4>
    <div class="list" id="filters"></div>
    <h4 id="bh">브랜드</h4>
    <div class="list brands" id="brands"></div>
  </aside>
  <section class="cal">
    <div class="top">
      <h1 id="title"></h1>
      <button class="ico today-btn" id="today">오늘</button>
      <button class="ico" id="qbtn" aria-label="검색"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button class="ico" id="theme" aria-label="다크 모드 전환" title="화면 모드"></button>
      <button class="ico" id="prev" aria-label="이전 달">&#8249;</button>
      <button class="ico" id="next" aria-label="다음 달">&#8250;</button>
    </div>
    <div id="qbox"><input type="search" id="q" placeholder="브랜드·이벤트 검색"></div>
    <div class="dow"></div>
    <div class="days" id="grid"></div>
    <div class="sheet" id="panel"></div>
  </section>
</div>
<script src="events.js"></script>
<script src="pending.js"></script>
<script>
const CATS = {
  "햄버거":"#e8590c","피자":"#e03131","치킨":"#d9480f","커피":"#a47551","분식":"#c2255c",
  "중식":"#c92a2a","일식":"#364fc7","한식":"#2f9e44","양식":"#5f3dc4","기타":"#868e96"
};
const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let cat = null;            // 선택한 종류 (null = 전체)
const brandSel = new Set(); // 선택한 브랜드 (비어 있으면 그 종류의 전체 브랜드)
let view = new Date(); view.setDate(1);
let selected = key(new Date());
let query = "";

// 수집된 항목 중 기간이 있고 제목에 가격 할인 표현이 있는 것만 표시한다 (공식 출처가 아니면 "예정/미확인" 배지)
const DISCOUNT = /할인|특가|1\+1|2\+1|반값|세일|쿠폰|%|무료/;
// 기간이 1년을 넘는 것은 상시 이벤트(종료일이 2050년처럼 형식상 값)로 보고 제외한다
// 기사 본문을 읽어 확인한 항목(enriched)은 전국 규모 판정을 거쳤으므로 제목 키워드 검사를 건너뛰고, 제외 판정(hide)은 숨긴다
const collected = (window.PENDING||[]).filter(e => !e.hide && e.start && e.end && (e.enriched || DISCOUNT.test(e.title)) &&
    (new Date(e.end) - new Date(e.start)) / 864e5 <= 366)
  .map(e => ({...e, url: e.source_url,
    note: e.enriched ? `기사 본문 확인${e.discount ? " · " + e.discount : ""}${e.verified ? "" : " · 시작일 미기재(게재일 기준)"} (${e.source_name})`
      : e.verified ? "공식 이벤트 페이지에서 자동 수집" : `기사 기반 · 기간은 제목으로 추정 (${e.source_name||"뉴스"})`}));
const fixed = (window.EVENTS||[]).concat(collected).map(e => ({...e, end: e.end || e.start}));
// 반복 행사를 보고 있는 연도 전후(연말·연초 칸 포함)로 펼친다
function recurringFor(year) {
  return (window.RECURRING||[]).map(r => ({
    title: r.title, brand: r.brand, category: r.category, url: r.url, note: r.note, verified: true,
    start: `${year}-${pad(r.month)}-${pad(r.day)}`,
    end: `${year}-${pad(r.endMonth||r.month)}-${pad(r.endDay||r.day)}`,
  }));
}
const visible = (noCat) => [view.getFullYear()-1, view.getFullYear(), view.getFullYear()+1]
  .flatMap(recurringFor).concat(fixed).filter(e => (noCat || !cat || e.category === cat) &&
  (noCat || !brandSel.size || brandSel.has(e.brand)) &&
  (!query || (e.title+e.brand).toLowerCase().includes(query)));
// 기간이 있는 이벤트도 시작일 칸에만 표시한다 (기간은 상세 패널에 적힌다)
const onDay = (list, k) => list.filter(e => e.start === k);

function chip(box, text, color, on, onclick, count, cls) {
  const s = document.createElement("div");
  s.className = "cat" + (cls ? " " + cls : "") + (on ? " on" : "");
  if (on) s.style.background = color;
  s.innerHTML = (cls ? "" : `<span class="dot" style="background:${color}"></span>`) + `<span>${text}</span>` + (count ? `<span class="cnt">${count}</span>` : "");
  s.onclick = onclick;
  box.appendChild(s);
}

// 왼쪽(모바일은 위) 목록: 종류 + (종류를 고르면) 그 종류의 브랜드. 숫자는 이번 달 이벤트 수
function renderFilters() {
  const box = document.getElementById("filters"), bbox = document.getElementById("brands");
  box.innerHTML = bbox.innerHTML = "";
  const y = view.getFullYear(), m = pad(view.getMonth()+1), inMonth = e => e.start.startsWith(`${y}-${m}`);
  const all = visible(true).filter(inMonth), n = c => all.filter(e => e.category === c).length || "";
  chip(box, "전체", "var(--all)", !cat, () => { cat = null; brandSel.clear(); render(); }, all.length || "");
  for (const [c,color] of Object.entries(CATS))
    chip(box, c, color, cat === c, () => { cat = cat === c ? null : c; brandSel.clear(); render(); }, n(c));
  document.getElementById("bh").textContent = cat ? `${cat} 브랜드` : "";
  if (!cat) return;
  const known = (window.BRANDS||{})[cat] || [];
  const fromData = [...fixed, ...(window.RECURRING||[])].filter(e => e.category === cat).map(e => e.brand);
  const brands = [...new Set([...known, ...fromData])];
  const bn = b => all.filter(e => e.brand === b).length || "";
  chip(bbox, "전체 브랜드", CATS[cat], !brandSel.size, () => { brandSel.clear(); render(); }, "", "br");
  brands.forEach(b => chip(bbox, b, CATS[cat], brandSel.has(b),
    () => { brandSel.has(b) ? brandSel.delete(b) : brandSel.add(b); render(); }, bn(b), "br"));
}

function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  document.getElementById("title").innerHTML = `${view.getMonth()+1}월<small>${view.getFullYear()}</small>`;
  const dow = document.querySelector(".dow");
  if (!dow.children.length) "일월화수목금토".split("").forEach(d => { const e=document.createElement("div"); e.textContent=d; dow.appendChild(e); });
  const start = new Date(view);
  start.setDate(1 - view.getDay());
  const list = visible(), todayK = key(new Date());
  const weeks = Math.ceil((view.getDay() + new Date(view.getFullYear(), view.getMonth()+1, 0).getDate()) / 7);
  for (let i=0;i<weeks*7;i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = key(d), cell = document.createElement("div");
    cell.className = "day" + (d.getMonth()!==view.getMonth()?" other":"") + (k===todayK?" today":"") +
      (k===selected?" sel":"") + (d.getDay()===0?" sun":"") + (d.getDay()===6?" sat":"");
    const evs = onDay(list,k);
    const colors = [...new Set(evs.map(e => CATS[e.category]))].slice(0,3);
    cell.innerHTML = `<span class="n">${d.getDate()}</span><span class="dots">${colors.map(c=>`<i style="background:${c}"></i>`).join("")}${evs.length>3?`<em>+${evs.length}</em>`:""}</span>`;
    cell.onclick = () => { selected = k; if (d.getMonth()!==view.getMonth()) { view = new Date(d.getFullYear(), d.getMonth(), 1); } render(); };
    grid.appendChild(cell);
  }
}

function renderPanel() {
  const p = document.getElementById("panel");
  const evs = onDay(visible(), selected);
  const [y,m,d] = selected.split("-");
  const wd = "일월화수목금토"[new Date(selected).getDay()];
  let h = `<h3>${+m}월 ${+d}일 (${wd})<span>${evs.length}개</span></h3>`;
  if (!evs.length) h += `<div class="empty">이 날 시작하는 할인 이벤트가 없어요</div>`;
  evs.forEach(e => {
    const range = e.start===e.end ? "하루 한정" : `${e.start.slice(5).replace("-","/")} ~ ${e.end.slice(5).replace("-","/")}`;
    h += `<div class="item"><div class="bar" style="background:${CATS[e.category]}"></div><div>
      <div class="b" style="color:${CATS[e.category]}">${e.brand}</div>
      <div class="t">${e.title}${e.verified?"":'<span class="badge">예정/미확인</span>'}</div>
      <div class="m">${range}${e.discount?" · "+e.discount:""}${e.url?` · <a href="${e.url}" target="_blank" rel="noopener">공고 보기</a>`:""}</div></div></div>`;
  });
  p.innerHTML = h;
}

// 화면 모드: 저장된 선택(라이트/다크) 우선, 없으면 기기 설정을 따른다
const ICON = {
  light: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>',
  dark: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
};
function setTheme(t, save) {
  document.documentElement.dataset.theme = t;
  document.getElementById("theme").innerHTML = ICON[t];   // 아이콘은 '눌렀을 때 바뀔 모드'
  if (save) try { localStorage.setItem("theme", t); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
const mq = matchMedia("(prefers-color-scheme: dark)");
setTheme(saved || (mq.matches ? "dark" : "light"));
mq.onchange = e => { if (!localStorage.getItem("theme")) setTheme(e.matches ? "dark" : "light"); };
document.getElementById("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);

function go(n) { view = new Date(view.getFullYear(), view.getMonth()+n, 1); render(); }
function render() { renderFilters(); renderGrid(); renderPanel(); }
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.getElementById("today").onclick = () => { view = new Date(); view.setDate(1); selected = key(new Date()); render(); };
document.getElementById("qbtn").onclick = () => { const b=document.getElementById("qbox"); b.classList.toggle("on"); if (b.classList.contains("on")) document.getElementById("q").focus(); };
document.getElementById("q").oninput = ev => { query = ev.target.value.trim().toLowerCase(); render(); };
// 좌우로 밀어서 달 이동
let sx = null; const gridEl = document.getElementById("grid");
gridEl.addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive:true});
gridEl.addEventListener("touchend", e => { if (sx!==null) { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx)>50) go(dx<0?1:-1); sx=null; } });
render();
</script>
</body>
</html>
